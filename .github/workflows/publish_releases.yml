name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to, e.g. v5.0.9"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build_wheels:
    name: Build native wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_pyodide_wheels:
    name: Build Pyodide/Emscripten wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build Pyodide wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_PLATFORM: pyodide

      - name: Verify Pyodide wheel names
        run: |
          set -euo pipefail

          echo "Built wheels:"
          ls -lh wheelhouse/

          if find wheelhouse -maxdepth 1 \( -name '*manylinux*.whl' -o -name '*linux_x86_64*.whl' -o -name '*macosx*.whl' -o -name '*win_amd64*.whl' \) | grep -q .; then
            echo "ERROR: Pyodide job produced native platform wheels, not Pyodide/Emscripten wheels"
            exit 1
          fi

          if ! find wheelhouse -maxdepth 1 -name '*.whl' | grep -q .; then
            echo "ERROR: No wheels were produced"
            exit 1
          fi

          if ! find wheelhouse -maxdepth 1 \
              \( -name '*emscripten*.whl' -o -name '*pyodide*.whl' -o -name '*wasm32*.whl' -o -name '*py3-none-any*.whl' \) \
              | grep -q .; then
            echo "ERROR: No Pyodide/Emscripten-compatible wheel name found"
            echo "Expected a wheel filename containing one of: emscripten, pyodide, wasm32, py3-none-any"
            exit 1
          fi

      - name: Upload Pyodide wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: Publish PyPI-compatible distributions
    runs-on: ubuntu-latest
    needs:
      - build_wheels
      - build_sdist
    environment:
      name: pypi
      url: https://pypi.org/p/phispy
    permissions:
      id-token: write

    steps:
      - name: Download native wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist/

      - name: Remove Pyodide wheels if accidentally included
        run: |
          find dist -type f -name '*pyodide*' -print -delete || true
          find dist -type f -name '*emscripten*' -print -delete || true
          find dist -type f -name '*wasm32*' -print -delete || true

      - name: Show distributions to publish
        run: |
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach_pyodide_wheels_to_release:
    name: Attach Pyodide wheels to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_pyodide_wheels
    permissions:
      contents: write

    steps:
      - name: Show target release tag
        run: |
          echo "Target release tag: $RELEASE_TAG"

      - name: Download Pyodide wheels
        uses: actions/download-artifact@v7
        with:
          name: wheels-pyodide
          path: pyodide-wheelhouse/

      - name: Verify downloaded Pyodide wheels
        run: |
          set -euo pipefail

          echo "Downloaded Pyodide wheel files:"
          ls -lh pyodide-wheelhouse/

          if find pyodide-wheelhouse -maxdepth 1 \( -name '*manylinux*.whl' -o -name '*linux_x86_64*.whl' -o -name '*macosx*.whl' -o -name '*win_amd64*.whl' \) | grep -q .; then
            echo "ERROR: downloaded Pyodide artifact contains native platform wheels"
            exit 1
          fi

          if ! find pyodide-wheelhouse -maxdepth 1 \
              \( -name '*emscripten*.whl' -o -name '*pyodide*.whl' -o -name '*wasm32*.whl' -o -name '*py3-none-any*.whl' \) \
              | grep -q .; then
            echo "ERROR: downloaded artifact does not contain a Pyodide/Emscripten-compatible wheel"
            exit 1
          fi

      - name: Show Pyodide wheels
        run: |
          ls -lh pyodide-wheelhouse/

      - name: Upload Pyodide wheels to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" pyodide-wheelhouse/*.whl \
          --repo "${{ github.repository }}" \
          --clobber

  attach_training_sets_json_to_release:
    name: Attach training-sets.json to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PhiSpy
        run: pip install .

      - name: Generate training-set metadata
        run: |
          python scripts/generate_training_sets_json.py --output release-assets/training-sets.json

      - name: Validate training-sets.json
        run: |
          set -euo pipefail

          if [ ! -f release-assets/training-sets.json ]; then
            echo "ERROR: release-assets/training-sets.json was not created"
            exit 1
          fi

          python - <<'EOF'
          import json, sys
          with open("release-assets/training-sets.json") as fh:
              data = json.load(fh)
          required_top = {"phispyVersion", "schemaVersion", "trainingSets"}
          missing_top = required_top - data.keys()
          if missing_top:
              print(f"ERROR: missing top-level keys: {missing_top}", file=sys.stderr)
              sys.exit(1)
          required_entry = {"value", "count", "genomeFile", "label"}
          for ts in data["trainingSets"]:
              missing = required_entry - ts.keys()
              if missing:
                  print(f"ERROR: entry {ts} missing keys: {missing}", file=sys.stderr)
                  sys.exit(1)
          print(f"OK: {len(data['trainingSets'])} training sets, version {data['phispyVersion']}")
          EOF

      - name: Show target release tag
        run: |
          echo "Target release tag: $RELEASE_TAG"

      - name: Upload training-set metadata to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/training-sets.json \
            --repo "${{ github.repository }}" \
            --clobber
